<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ducy-relay.ducy.workers.dev https://ducy-relay-staging.ducy.workers.dev https://ducy-relay-sandbox.ducy.workers.dev https://ducy.cards https://staging.ducy.cards https://sandbox.ducy.cards ws://localhost:* http://localhost:*; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>ducy admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/admin.css">
  <script defer src="src/browser-check.js"></script>
</head>
<body>
<main>
  <header class="row">
    <h1>ducy admin</h1>
    <div class="seg" id="envs" role="group" aria-label="Environment"></div>
    <span id="me" class="muted"></span>
  </header>
  <nav class="row" id="nav" hidden>
    <button data-go="overview">Overview</button>
    <button data-go="clubs">Clubs</button>
    <button data-go="people">People</button>
    <button data-go="log">Admin log</button>
    <button data-go="errors">Errors</button>
  </nav>
  <p id="status" class="muted"></p>

  <section id="not-admin" hidden>
    <h2>Not on the admin list</h2>
    <dl>
      <dt>Player ID</dt><dd><code id="na-id"></code></dd>
      <dt>Public key</dt><dd><code id="na-pub"></code></dd>
    </dl>
    <h3>admins.json entry</h3>
    <pre id="na-entry"></pre>
    <button id="na-copy">Copy</button>
    <h3>Use your admin key</h3>
    <div class="row">
      <input type="file" id="na-file" accept=".json,application/json" aria-label="Backup file">
      <input type="password" id="na-pass" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button class="primary" id="na-restore">Restore</button>
    </div>
  </section>

  <div id="view"></div>
</main>
<script type="module" src="src/admin.js"></script>
</body>
</html>
