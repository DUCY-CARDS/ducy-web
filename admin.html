<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://ducy-relay.ducy.workers.dev https://ducy-relay.ducy.workers.dev ws://localhost:* http://localhost:*; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex, nofollow">
  <title>ducy admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/admin.css">
</head>
<body>
<main>
  <header class="row">
    <h1>ducy admin</h1>
    <nav class="row" id="nav" hidden>
      <button data-go="clubs">Clubs</button>
      <button data-go="people">People</button>
      <button data-go="log">Admin log</button>
    </nav>
  </header>

  <section>
    <div class="row">
      <label>Relay <input id="relay" size="34"></label>
      <button class="primary" id="load">Load</button>
      <span id="me" class="muted"></span>
    </div>
    <p id="status" class="muted"></p>
  </section>

  <section id="not-admin" hidden>
    <h2>Not on the admin list</h2>
    <dl>
      <dt>Player ID</dt><dd><code id="na-id"></code></dd>
      <dt>Public key</dt><dd><code id="na-pub"></code></dd>
    </dl>
    <h3>admins.json entry</h3>
    <pre id="na-entry"></pre>
    <button id="na-copy">Copy</button>
  </section>

  <div id="view"></div>
</main>
<script type="module" src="src/admin.js"></script>
</body>
</html>
