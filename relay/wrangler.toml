# Cloudflare Worker that relays multiplayer messages for the #play page.
# Deploy: see README.md.
name = "ducy-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Always-on clubs: who has them, and how much they're used (registry.js).
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]

[vars]
# Comma-separated page origins allowed to connect, e.g. "https://ducy.example".
# Empty allows any origin. The site only, so other pages can't use the relay (#103);
# a page opened from elsewhere (e.g. localhost) uses a local relay instead.
ALLOWED_ORIGINS = "https://ducy.cards,https://www.ducy.cards"
# Always-on clubs (#98, #265): at most this many per owner, and in all,
# while on Cloudflare's free plan. Creating a club takes permission, granted
# on the admin page (admin.html), except each player's one free trial club.
# CLUB_CREATORS: a comma-separated list of player IDs granted here as well.
# The admin API needs a secret: `wrangler secret put ADMIN_TOKEN` (24+
# characters, e.g. `openssl rand -hex 24`).
MAX_CLUBS_PER_OWNER = "3"
MAX_CLUBS = "25"
CLUB_CREATORS = ""
