# Cloudflare Worker that relays multiplayer messages for the #play page.
# Deploy: see README.md.
name = "ducy-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Always-on clubs: who has them, and how much they're used (registry.js).
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]

[vars]
# Comma-separated page origins allowed to connect, e.g. "https://ducy.example".
# Empty allows any origin. The site only, so other pages can't use the relay (#103);
# a page opened from elsewhere (e.g. localhost) uses a local relay instead.
ALLOWED_ORIGINS = "https://ducy.cards,https://www.ducy.cards"
# The admin site (#601): may call /admin/ only.
ADMIN_ORIGINS = "https://admin.ducy.cards"
# Always-on clubs (#98, #265): at most this many per owner, and in all,
# while on Cloudflare's free plan. Creating a club takes permission, granted
# on the admin site (admin.ducy.cards, #601), except each player's one free
# trial club. CLUB_CREATORS: a comma-separated list of player IDs granted
# here as well. Who may use the admin site: ../admins.json, bundled into the
# Worker (#401).
# Cloudflare's numbers on the admin site (optional, #601): the secrets
# CF_ANALYTICS_TOKEN (Account Analytics: Read) and CF_ACCOUNT_ID, set with
# `wrangler secret put` on each environment (DEPLOY.md).
MAX_CLUBS_PER_OWNER = "3"
MAX_CLUBS = "25"
CLUB_CREATORS = ""
# The beta (#551): a club takes a grant, with no trial clubs, and unused clubs
# aren't deleted.
TRIALS = "off"
KEEP_UNUSED_CLUBS = "on"

# Staging and sandbox (DEPLOY.md): Workers of their own, so their own Durable
# Objects and data, each allowing only its own site. `wrangler deploy --env
# staging`. Environments don't inherit bindings or vars, so they're repeated;
# migrations are inherited. No backup secrets are set on them, so backups are
# off.
[env.staging]
name = "ducy-relay-staging"

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.staging.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://staging.ducy.cards"
ADMIN_ORIGINS = "https://admin.ducy.cards"
MAX_CLUBS_PER_OWNER = "3"
MAX_CLUBS = "25"
CLUB_CREATORS = ""
TRIALS = "off"
KEEP_UNUSED_CLUBS = "on"

# The sandbox can be wiped (relay/src/reset.js): RESETTABLE turns that on.
# Never set it on the live relay or staging.
[env.sandbox]
name = "ducy-relay-sandbox"

[[env.sandbox.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.sandbox.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[env.sandbox.vars]
ENVIRONMENT = "sandbox"
ALLOWED_ORIGINS = "https://sandbox.ducy.cards"
ADMIN_ORIGINS = "https://admin.ducy.cards"
MAX_CLUBS_PER_OWNER = "3"
MAX_CLUBS = "25"
CLUB_CREATORS = ""
TRIALS = "off"
KEEP_UNUSED_CLUBS = "on"
RESETTABLE = "on"
