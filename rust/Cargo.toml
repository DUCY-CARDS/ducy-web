# ducy.cards' own Rust: the clubs, the study tools, the games against the
# bots, Bankroll Quest, and the site's wasm bindings (ducy-wasm). They're
# built on ducy's generic poker crates, pinned to one revision of
# allenpiscitello/ducy: bump `rev` (and run `cargo update`) to take a newer one.
[workspace]
resolver = "3"
members = ["ducy-wasm", "ducy-club", "ducy-training", "ducy-bot-games", "ducy-quest"]

[workspace.dependencies]
ducy = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1", default-features = false }
ducy-play = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1", default-features = false }
ducy-bots = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1", default-features = false }
ducy-host = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1", default-features = false }
ducy-gto = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1", default-features = false }
ducy-shuffle = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1" }
ducy-identity = { git = "https://github.com/allenpiscitello/ducy", rev = "316dcfc910a8f9b8c6e7d5fe9c0a1e6d808458e1" }

# The curve arithmetic in ducy-shuffle is ~50x slower unoptimized; keep
# debug builds and tests quick by optimizing just that dependency.
[profile.dev.package.curve25519-dalek]
opt-level = 3

# Tests run optimized, with overflow checks and debug assertions still on.
[profile.test]
opt-level = 2
debug = "line-tables-only"
