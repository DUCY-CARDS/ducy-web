[package]
name = "ducy-judge"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
# The postflop fair play check's bindings (wasm-pack): ducy's heads-up GTO
# models scoring club players' decisions, for the judge Worker
# (relay/judge/). Not a crates.io crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducy-play = { workspace = true, features = ["serde"] }
ducy-gto = { workspace = true, features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
