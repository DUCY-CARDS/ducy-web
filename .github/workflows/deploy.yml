name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout ducy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: allenpiscitello/ducy
          path: ducy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-26
        with:
          targets: wasm32-unknown-unknown

      # wasm-pack at a pinned version, checked against its release's SHA-256.
      - name: Install wasm-pack
        env:
          WASM_PACK: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          DIR="wasm-pack-$WASM_PACK-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/$WASM_PACK/$DIR.tar.gz"
          echo "$WASM_PACK_SHA256  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$DIR/wasm-pack" ~/.cargo/bin/
          wasm-pack --version

      - name: Build WASM
        run: |
          cd ducy
          wasm-pack build ducy-wasm --target web --out-dir pkg --no-typescript

      - name: Copy WASM to site
        run: |
          mkdir -p wasm
          cp ducy/ducy-wasm/pkg/ducy_wasm.js wasm/
          cp ducy/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/

      # Each release goes under v/<site commit>-<ducy commit>/, so a ducy-only
      # redeploy (workflow_dispatch) also gets a fresh folder.
      - name: Build site
        run: |
          DUCY_SHA="$(git -C ducy rev-parse --short=8 HEAD)"
          scripts/build-site.sh "${GITHUB_SHA::8}-${DUCY_SHA}" _site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: scripts/deploy.sh _site "${{ secrets.SSH_DEPLOY_TARGET }}"

      # The GTO bots' models are published as releases of the ducy repo
      # (assets cards.bin and blueprint.bin): gto-hunl-<name> for heads-up
      # No-limit Hold'em, pointed at by gto/current.json, gto-plo-<name> for
      # heads-up PLO4, by gto/plo-current.json, gto-plo5-<name> for heads-up
      # PLO5, by gto/plo5-current.json, and gto-plo6-<name> for heads-up PLO6,
      # by gto/plo6-current.json (the prefixes don't overlap: "gto-plo5-" and
      # "gto-plo6-" don't start with "gto-plo-"). The release each uses is
      # the one gto-pins.json pins for its prefix (so a new model goes live
      # only when a PR moves the pin), else the newest; it's uploaded to
      # gto/<tag>/ unless it's already there; see scripts/upload-gto.sh.
      - name: Publish the GTO bot models
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: |
          for PAIR in gto-hunl-:current.json gto-plo-:plo-current.json gto-plo5-:plo5-current.json gto-plo6-:plo6-current.json; do
            PREFIX="${PAIR%%:*}"
            MANIFEST="${PAIR#*:}"
            TAG="$(jq -r --arg p "$PREFIX" '.[$p] // empty' gto-pins.json)"
            [ -n "$TAG" ] || TAG="$(gh release list -R allenpiscitello/ducy --limit 100 --json tagName,publishedAt \
              -q "[.[] | select(.tagName | startswith(\"$PREFIX\"))] | sort_by(.publishedAt) | last | .tagName // empty")"
            if [ -z "$TAG" ]; then echo "no $PREFIX model release yet"; continue; fi
            if rsync --list-only "$TARGET/gto/$TAG/blueprint.bin" >/dev/null 2>&1; then
              echo "$TAG is already published"
              continue
            fi
            rm -rf gto-model
            gh release download "$TAG" -R allenpiscitello/ducy -p cards.bin -p blueprint.bin -D gto-model
            scripts/upload-gto.sh gto-model/cards.bin gto-model/blueprint.bin "$TAG" "$TARGET" "$MANIFEST"
          done
      # The Hold'em GTO bot's blueprints for other depths: the newest
      # gto-depth-hunl-<N>bb-<name> release for each depth, listed in
      # gto/depths.json (scripts/upload-gto-depths.sh).
      - name: Publish the GTO bot's other depths
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: scripts/upload-gto-depths.sh "$TARGET"
      # The six-handed GTO bot's preflop strategy: the newest gto-sixmax-<name>
      # release, pointed at by gto/sixmax-current.json (scripts/upload-gto-sixmax.sh).
      - name: Publish the six-handed GTO bot
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: scripts/upload-gto-sixmax.sh "$TARGET"
