name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ducy
        uses: actions/checkout@v4
        with:
          repository: allenpiscitello/ducy
          path: ducy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd ducy
          wasm-pack build ducy-wasm --target web --out-dir pkg --no-typescript

      - name: Copy WASM to site
        run: |
          mkdir -p wasm
          cp ducy/ducy-wasm/pkg/ducy_wasm.js wasm/
          cp ducy/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/

      # Each release goes under v/<site commit>-<ducy commit>/, so a ducy-only
      # redeploy (workflow_dispatch) also gets a fresh folder.
      - name: Build site
        run: |
          DUCY_SHA="$(git -C ducy rev-parse --short=8 HEAD)"
          scripts/build-site.sh "${GITHUB_SHA::8}-${DUCY_SHA}" _site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: scripts/deploy.sh _site "${{ secrets.SSH_DEPLOY_TARGET }}"

      # The GTO bot's model is published as a release of the ducy repo tagged
      # gto-<name> (assets cards.bin and blueprint.bin). The newest one is
      # uploaded to gto/<tag>/ unless it's already there; see
      # scripts/upload-gto.sh.
      - name: Publish the GTO bot model
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: |
          TAG="$(gh release list -R allenpiscitello/ducy --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("gto-"))] | sort_by(.createdAt) | last | .tagName // empty')"
          if [ -z "$TAG" ]; then echo "no GTO model release yet"; exit 0; fi
          if rsync --list-only "$TARGET/gto/$TAG/blueprint.bin" >/dev/null 2>&1; then
            echo "$TAG is already published"
            exit 0
          fi
          gh release download "$TAG" -R allenpiscitello/ducy -p cards.bin -p blueprint.bin -D gto-model
          scripts/upload-gto.sh gto-model/cards.bin gto-model/blueprint.bin "$TAG" "$TARGET"
