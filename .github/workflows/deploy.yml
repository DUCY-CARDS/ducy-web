name: Deploy production

# Ships ducy.cards and its relay (ducy-relay) together from one commit, only
# when run by hand and approved (the production environment's required
# reviewer). Pushes to master go to staging only (staging.yml). DEPLOY.md
# has the release, rollback and hotfix steps.
#
# ref:
#   empty                  release master: tag it vYYYY.MM.DD (.2, .3, ... for
#                          later releases that day) and make a GitHub release
#   a release tag (v...)   redeploy that release (a rollback): no new tag
#   a branch or commit     release it (a hotfix): tagged as for master
#
# Secrets: SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, SSH_DEPLOY_TARGET (the site),
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the relay).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Empty for master; a release tag to roll back to; or a hotfix branch or commit
        type: string
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ducy.cards/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 0

      # What's shipping, and the release tag: the one asked for, the one this
      # commit already has, or a new one for today.
      - name: Release tag
        id: release
        env:
          REF: ${{ inputs.ref }}
        run: |
          RE='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          git fetch --tags --force origin
          SHA="$(git rev-parse HEAD)"
          NEW=false
          if [[ "$REF" =~ $RE ]] && git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then
            TAG="$REF"
          else
            TAG="$(git tag --points-at HEAD | grep -E "$RE" | sort -V | tail -n 1 || true)"
            if [ -z "$TAG" ]; then
              BASE="v$(date -u +%Y.%m.%d)"
              TAG="$BASE"
              N=1
              while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
                N=$((N + 1))
                TAG="$BASE.$N"
              done
              NEW=true
            fi
          fi
          echo "Shipping $SHA as $TAG (new tag: $NEW)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      # The revision of ducy's generic crates rust/Cargo.toml pins.
      - name: Pinned ducy
        id: ducy
        run: echo "rev=$(scripts/ducy-rev.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-26
        with:
          targets: wasm32-unknown-unknown

      # wasm-pack at a pinned version, checked against its release's SHA-256.
      - name: Install wasm-pack
        env:
          WASM_PACK: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          DIR="wasm-pack-$WASM_PACK-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/$WASM_PACK/$DIR.tar.gz"
          echo "$WASM_PACK_SHA256  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$DIR/wasm-pack" ~/.cargo/bin/
          wasm-pack --version

      - name: Build WASM
        run: |
          cd rust/ducy-wasm
          wasm-pack build --target web --out-dir pkg --no-typescript

      - name: Copy WASM to site
        run: |
          mkdir -p wasm
          cp rust/ducy-wasm/pkg/ducy_wasm.js wasm/
          cp rust/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/

      # Each release goes under v/<site commit>-<pinned ducy commit>/.
      - name: Build site
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          DUCY_SHA="$(echo "${{ steps.ducy.outputs.rev }}" | cut -c1-8)"
          scripts/build-site.sh "${SHA::8}-${DUCY_SHA}" _site

      # The admin site (admin.ducy.cards, #601), from the same release and
      # the site's WASM, before the relay's build replaces it.
      - name: Build the admin site
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          DUCY_SHA="$(echo "${{ steps.ducy.outputs.rev }}" | cut -c1-8)"
          scripts/build-admin.sh "${SHA::8}-${DUCY_SHA}" _admin

      # The relay: the clubs-only build (#463), which never runs the bot
      # tables or the GTO bots, so the Worker loads less and starts faster.
      # The site is already built, so wasm/ can take it.
      - name: Build the relay's WASM
        run: |
          cd rust/ducy-wasm
          wasm-pack build --target web --out-dir pkg --no-typescript --no-default-features
          cd ../..
          cp rust/ducy-wasm/pkg/ducy_wasm.js rust/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Relay tests
        run: |
          npm ci --prefix relay
          node --test test/relay-queue.test.mjs test/relay-club.test.mjs test/relay-admin.test.mjs test/admin-api.test.mjs test/registry.test.mjs test/club-room.test.mjs test/relay-reset.test.mjs test/stats.test.mjs

      - name: Deploy the relay
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: "4"
          command: deploy --var COMMIT:${{ steps.release.outputs.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy the site via rsync
        run: scripts/deploy.sh _site "${{ secrets.SSH_DEPLOY_TARGET }}"

      # The GTO bots' models are published as releases of the ducy repo
      # (assets cards.bin and blueprint.bin): gto-hunl-<name> for heads-up
      # No-limit Hold'em, pointed at by gto/current.json, gto-plo-<name> for
      # heads-up PLO4, by gto/plo-current.json, gto-plo5-<name> for heads-up
      # PLO5, by gto/plo5-current.json, and gto-plo6-<name> for heads-up PLO6,
      # by gto/plo6-current.json (the prefixes don't overlap: "gto-plo5-" and
      # "gto-plo6-" don't start with "gto-plo-"). The release each uses is
      # the one gto-pins.json pins for its prefix (so a new model goes live
      # only when a PR moves the pin), else the newest; it's uploaded to
      # gto/<tag>/ unless it's already there; see scripts/upload-gto.sh.
      - name: Publish the GTO bot models
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: |
          for PAIR in gto-hunl-:current.json gto-plo-:plo-current.json gto-plo5-:plo5-current.json gto-plo6-:plo6-current.json; do
            PREFIX="${PAIR%%:*}"
            MANIFEST="${PAIR#*:}"
            TAG="$(jq -r --arg p "$PREFIX" '.[$p] // empty' gto-pins.json)"
            [ -n "$TAG" ] || TAG="$(gh release list -R allenpiscitello/ducy --limit 100 --json tagName,publishedAt \
              -q "[.[] | select(.tagName | startswith(\"$PREFIX\"))] | sort_by(.publishedAt) | last | .tagName // empty")"
            if [ -z "$TAG" ]; then echo "no $PREFIX model release yet"; continue; fi
            if rsync --list-only "$TARGET/gto/$TAG/blueprint.bin" >/dev/null 2>&1; then
              echo "$TAG is already published"
              continue
            fi
            rm -rf gto-model
            gh release download "$TAG" -R allenpiscitello/ducy -p cards.bin -p blueprint.bin -D gto-model
            scripts/upload-gto.sh gto-model/cards.bin gto-model/blueprint.bin "$TAG" "$TARGET" "$MANIFEST"
          done
      # The Hold'em GTO bot's blueprints for other depths: the newest
      # gto-depth-hunl-<N>bb-<name> release for each depth, listed in
      # gto/depths.json (scripts/upload-gto-depths.sh).
      - name: Publish the GTO bot's other depths
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: scripts/upload-gto-depths.sh "$TARGET"
      # The six-handed GTO bot's preflop strategy: the newest gto-sixmax-<name>
      # release, pointed at by gto/sixmax-current.json (scripts/upload-gto-sixmax.sh).
      - name: Publish the six-handed GTO bot
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET }}
        run: scripts/upload-gto-sixmax.sh "$TARGET"

      # A new release: tag the commit and write the release notes from the
      # PRs since the last release. A rollback makes neither.
      - name: Tag and release
        if: steps.release.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

      # Last, so nothing above waits on it. Into the admin.ducy.cards
      # subdomain's folder, keeping its password protection: skipped with a
      # warning while the folder doesn't exist, and failed (never uploaded
      # open) while it has no password (scripts/deploy-admin.sh).
      - name: Deploy the admin site
        run: scripts/deploy-admin.sh _admin "${{ secrets.SSH_DEPLOY_TARGET }}/admin"
