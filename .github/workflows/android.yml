name: Android test APK

# A debug APK of the Capacitor shell in app/ (it opens https://ducy.cards),
# uploaded as the run's artifact "ducy-android-debug".
on:
  workflow_dispatch:
  push:
    branches: [pr/android-apk]
    paths: [app/**, .github/workflows/android.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK comes with the runner ($ANDROID_HOME).
      - name: Capacitor and the Android project
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android

      - name: Build the debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ducy-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
