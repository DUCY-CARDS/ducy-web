name: Deploy relay

# Deploys relay/ (the Cloudflare Worker that forwards multiplayer messages)
# when a change to it reaches master, after its tests pass. Needs two
# repository secrets: CLOUDFLARE_API_TOKEN (a token from the "Edit Cloudflare
# Workers" template) and CLOUDFLARE_ACCOUNT_ID.
#
# Always-on clubs (#93) run the site's club code (src/) and ducy's engine
# (built here from allenpiscitello/ducy, as for the site) in the Worker, so
# changes to src/ redeploy it too. After an engine-only change, run this by
# hand (workflow_dispatch) to pick it up. admins.json (who may use the admin
# page, #401) is bundled in, so a change to it redeploys too.

on:
  push:
    branches: [master]
    paths: ['relay/**', 'src/**', 'admins.json', '.github/workflows/relay.yml']
  workflow_dispatch:

concurrency:
  group: relay-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout ducy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: allenpiscitello/ducy
          path: ducy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-26
        with:
          targets: wasm32-unknown-unknown

      # wasm-pack at a pinned version, checked against its release's SHA-256.
      - name: Install wasm-pack
        env:
          WASM_PACK: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          DIR="wasm-pack-$WASM_PACK-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/$WASM_PACK/$DIR.tar.gz"
          echo "$WASM_PACK_SHA256  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$DIR/wasm-pack" ~/.cargo/bin/
          wasm-pack --version

      - name: Build WASM
        run: |
          cd ducy
          wasm-pack build ducy-wasm --target web --out-dir pkg --no-typescript
          cd ..
          mkdir -p wasm
          cp ducy/ducy-wasm/pkg/ducy_wasm.js ducy/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Relay tests
        run: |
          npm ci --prefix relay
          node --test test/relay-queue.test.mjs test/relay-club.test.mjs test/relay-admin.test.mjs test/admin-api.test.mjs test/registry.test.mjs test/club-room.test.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: "4"
          command: deploy
