name: Deploy relay

# Deploys relay/ (the Cloudflare Worker that forwards multiplayer messages)
# when a change to it reaches master, after its tests pass. Needs two
# repository secrets: CLOUDFLARE_API_TOKEN (a token from the "Edit Cloudflare
# Workers" template) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [master]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Relay tests
        run: |
          npm ci --prefix relay
          node --test test/relay-queue.test.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: "4"
          command: deploy
