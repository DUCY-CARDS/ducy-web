name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Relay dependencies
        run: npm ci --prefix relay

      - name: Checkout ducy
        uses: actions/checkout@v7
        with:
          repository: allenpiscitello/ducy
          path: ducy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd ducy
          wasm-pack build ducy-wasm --target web --out-dir pkg --no-typescript

      - name: Build site
        run: |
          mkdir -p wasm
          cp ducy/ducy-wasm/pkg/ducy_wasm.js ducy/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/
          scripts/build-site.sh "${GITHUB_SHA::8}" _site

      # After the wasm build: some modules call ducy's bindings (test/wasm.mjs).
      - name: Unit tests
        run: node --test test/play-stats.test.mjs test/ranges.test.mjs test/trainer-skills.test.mjs test/omaha-hand.test.mjs test/fair-deal.test.mjs test/club-tourneys.test.mjs test/club-tourneys-ui.test.mjs test/club-promos.test.mjs test/club-promos-server.test.mjs test/tourney-run.test.mjs test/club-alarms.test.mjs test/chip-format.test.mjs test/hand-words.test.mjs test/play-net.test.mjs test/play-review.test.mjs test/identity.test.mjs test/club.test.mjs test/club-chips.test.mjs test/club-tables.test.mjs test/club-roles.test.mjs test/club-agents.test.mjs test/hand-replay.test.mjs test/e2e.test.mjs test/relay-queue.test.mjs test/heartbeat.test.mjs test/tourney-structure.test.mjs test/club-room.test.mjs test/relay-club.test.mjs test/relay-admin.test.mjs test/registry.test.mjs test/backup.test.mjs test/club-help.test.mjs test/time-ago.test.mjs test/ladder.test.mjs test/quest.test.mjstest/chips.test.mjstest/ladder-review.test.mjs test/table-chat.test.mjs test/home.test.mjs test/regulars.test.mjs test/ranges-overview.test.mjs
