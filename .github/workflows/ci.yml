name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relay dependencies
        run: npm ci --prefix relay

      - name: Unit tests
        run: node --test test/play-stats.test.mjs test/play-net.test.mjs test/play-review.test.mjs test/identity.test.mjs test/club.test.mjs test/club-chips.test.mjs test/club-tables.test.mjs test/relay-queue.test.mjs

      - name: Checkout ducy
        uses: actions/checkout@v4
        with:
          repository: allenpiscitello/ducy
          path: ducy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd ducy
          wasm-pack build ducy-wasm --target web --out-dir pkg --no-typescript

      - name: Build site
        run: |
          mkdir -p wasm
          cp ducy/ducy-wasm/pkg/ducy_wasm.js ducy/ducy-wasm/pkg/ducy_wasm_bg.wasm wasm/
          scripts/build-site.sh "${GITHUB_SHA::8}" _site
